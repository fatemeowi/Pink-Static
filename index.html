<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pink Static</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="card">
      <h2>If your feeling today had a color, what color would they be?</h2>
    </div>

    <div class="options">
      <button data-theme="pink">Baby Pink</button>
      <button data-theme="warm">Warm Peach</button>
      <button data-theme="sky">Sky Blue</button>
      <button data-theme="dark">Dark Purple</button>
    </div>

    <audio id="bg-music" src="" loop></audio>

    <script src="script.js"></script>
  </body>
</html>
